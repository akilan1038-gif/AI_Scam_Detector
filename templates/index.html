<!DOCTYPE html>
<html>
<head>
    <title>AI Scam Detector</title>

    <style>
        body{
            margin:0;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:linear-gradient(135deg,#4f46e5,#06b6d4);
            font-family:Arial,sans-serif;
        }

        .container{
            background:white;
            width:450px;
            padding:30px;
            border-radius:15px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
            text-align:center;
        }

        textarea{
            width:100%;
            height:120px;
            padding:10px;
            border-radius:10px;
        }

        button{
            margin-top:15px;
            padding:10px 20px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🤖 AI Social Media Scam Detector</h1>

    <<form action="/predict" method="POST">>
        <textarea name="message" placeholder="Enter your message"></textarea><br>
        <button type="submit">Check Message</button>
    </form>

    {% if prediction %}
        <h2>{{ prediction }}</h2>
    {% endif %}
</div>

</body>
</html>
